# MariaDB on the shared server, through the trilogy adapter. The manager used
# to keep four SQLite files under storage/; it now lives in ONE database
# ("apps" in production) that also holds the Solid Cache/Queue/Cable tables, so
# a single mysqldump in the nightly backup captures all of it.
#
# Connection details come from the environment (.env, loaded by dotenv) and use
# the same DB_* names as every other app on the box.
default: &default
  adapter: trilogy
  encoding: utf8mb4
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 5).to_i + 5 } %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 3306) %>
  username: <%= ENV.fetch("DB_USERNAME", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_DATABASE", "apps_development") %>

# Rails erases and regenerates the test database, so it must never be the
# production one. DB_DATABASE is deliberately NOT consulted here.
test:
  <<: *default
  database: <%= ENV.fetch("DB_DATABASE_TEST", "apps_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_DATABASE", "apps") %>
